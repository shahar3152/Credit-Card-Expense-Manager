<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>My Charges</title>
    <link href="../css/All.css" rel="stylesheet" />
    <link href="../css/MyCharges.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
</head>
<body>
    <button id="backButton" class="back-button">Back to Dashboard</button>
    <h1>My Charges</h1>
    <div id="myChargesContainer">
        <label for="month">Select Month:</label>
        <select id="month" name="month"></select>

        <div id="chargeSummary">
            <h2>Total Charge for Selected Month:</h2>
            <div id="totalCharge"></div>
        </div>

        <div id="chargesTable">
            <h2>Charge List</h2>
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Business Name</th>
                        <th>Category</th>
                        <th>Amount</th>
                    </tr>
                </thead>
                <tbody id="transactionList"></tbody>
            </table>
        </div>

        <div id="bar-chart-container">
            <h2>Monthly Expenditure Comparison</h2>
            <canvas id="barChart"></canvas>
        </div>

        <div id="pie-chart-container">
            <canvas id="pieChart"></canvas>
            <div id="pieChartLegend"></div>
        </div>
    </div>
    <script src="../JS/MyCharges.js"></script>
</body>
</html>
