<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="../css/All.css" rel="stylesheet" />
    <link href="../css/SignUp.css" rel="stylesheet" />
    <title>Sign Up</title>
</head>
<body>
    <h1>Sign Up</h1>
    <div class="form-container">
        <form id="signUpForm">
            <div class="input-group">
                <label for="signupEmail">Email</label>
                <input type="email" id="signupEmail" placeholder="Enter your email" required>
            </div>
            <div class="input-group">
                <label for="signupPassword">Password</label>
                <input type="text" id="signupPassword" placeholder="Create a password" required>
            </div>
            <div class="input-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" required>
            </div>
            <div class="input-group">
                <label for="ccn">Credit Card Number</label>
                <input type="text" id="ccn" placeholder="xxxx-xxxx-xxxx-xxxx" required>
            </div>
            <div class="input-group">
                <label for="cce">Credit Card Expiry (mm/yy)</label>
                <input type="text" id="cce" placeholder="mm/yy" required>
            </div>
            <button type="submit" onclick="handleSignup(event)">Sign Up</button>
            <div id="errorMessage"></div>
            <div id="message"></div>
            <p class="redirect">Already have an account? <a href="login.html">Login</a></p>
        </form>
    </div>
    <script src="../JS/SignUp.js"></script>
</body>
</html>
